module.exports = "<div class=\"convo-chat\">\n    <div ng-hide=\"!collapsed\">\n        <button type=\"button\" class=\"btn start-chat\" title=\"\" ng-click=\"open()\">\n            <i class=\"fa fa-comment fa-2x\"></i>\n        </button>\n    </div>\n    <div class=\"card\" ng-hide=\"collapsed\">\n        <div class=\"card-header\">\n<!--             <i class=\"fa fa-comment fa-2x\"></i>  -->\n            {{ name }}\n            <div class=\"btn-group right\">\n\t            <button type=\"button\" class=\"btn\" title=\"Minimize chatbox\" ng-click=\"close()\">\n                    <i class=\"fa fa-window-minimize\"></i>\n                </button>\n\t            <button type=\"button\" class=\"btn\" title=\"End chat session\" ng-click=\"reset()\">\n                    <i class=\"fa fa-window-close\"></i>\n                </button>\n            </div>\n        </div>\n        <div class=\"panel-collapse\" id=\"collapseOne\">\n            <div class=\"card-body\" id=\"chat-panel-body\">\n                <ul class=\"chat\">\n                    <li class=\"clearfix\" ng-repeat=\"message in messages track by $index\"\n                        ng-class=\"{ 'break' : message.type == 'break'}\">\n                        <div ng-if=\"message.type != 'break'\" class=\"clearfix chat-body\"\n                        ng-class=\"{ 'right user-message' : message.source == 'user', 'left system-message' : message.source == 'convo'}\"\n                        ng-bind-html=\"applyMarkdown( message)\"></div>\n                    </li>\n                </ul>\n                <div style=\"height:6px; clear: both;\"></div>\n                <div class=\"lds-ellipsis\" ng-if=\"isSending()\"><div></div><div></div><div></div><div></div></div>\n            </div>\n            <div class=\"card-footer\">\n                <form ng-submit=\"formSubmitted()\">\n                    <div class=\"convo-form-group inline\" id=\"chat\">\n\n                        <input ng-model=\"message\" autocomplete=\"off\" id=\"message\" type=\"text\"\n                               class=\"convo-form-input\" placeholder=\"Type your message here...\" ng-disabled=\"isSending()\">\n                        <button ng-disabled=\"formDisabled()\" class=\"btn btn-send\" id=\"send\" type=\"submit\" aria-label=\"Send message\">\n                            <i class=\"fa fa-paper-plane\"></i>\n                        </button>\n                    </div>\n                </form>\n            </div>\n        </div>\n    </div>\n</div>\n";
