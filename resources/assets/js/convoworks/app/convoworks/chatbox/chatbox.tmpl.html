<div class="convo-chat">
    <div class="panel panel-primary">
        <div class="panel-heading" id="accordion" style="padding: 0.25em 0.5em;">
            <span class="glyphicon glyphicon-comment"></span> &nbsp; {{ name }}
            <div class="btn-group pull-right">
                <button type="button" class="btn btn-default btn-xs" title="Reset chat" ng-click="resetChat()">
	                <i class="glyphicon glyphicon-refresh"></i>
                </button>
	            <button type="button" class="btn btn-default btn-xs" title="Collapse chatbox" ng-click="collapsed = !collapsed">
                    <i class="glyphicon" ng-class="{ 'glyphicon-chevron-right' : collapsed, 'glyphicon-chevron-down': !collapsed}"></i>
                </button>
            </div>
        </div>
        <div class="panel-collapse" ng-hide="collapsed" id="collapseOne">
            <div class="panel-body" id="chat-panel-body">
                <ul class="chat">
                    <li class="clearfix" ng-repeat="message in messages track by $index" >

                        <!--<span class="chat-img" ng-class="{ 'pull-right' : message.source == 'user', 'pull-left' : message.source == 'convo'}">-->
                            <!--<img ng-src="{{message.avatar}}" alt="Avatar" class="img-circle" />-->
                        <!--</span>-->

                        <div ng-if="message.type == 'break'" style="height:6px;">
                        </div>
                        <div ng-if="message.type != 'break'" class="clearfix chat-body" ng-class="{ 'right user-message' : message.source == 'user', 'left system-message' : message.source == 'convo'}">
                            {{ message.text }}
                        </div>
                    </li>
                </ul>
            </div>
            <div class="panel-footer">
                <form ng-submit="formSubmited()">
                    <div class="input-group">
                        <input ng-model="message" autocomplete="off" id="btn-input" type="text"
                               class="form-control input-md" placeholder="Type your message here..." ng-disabled="isSending()" />
                        <span class="input-group-btn">
                            <button ng-disabled="formDisabled()" class="btn btn-warning btn-sm" id="btn-chat" type="submit">
                                Send
                            </button>
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
