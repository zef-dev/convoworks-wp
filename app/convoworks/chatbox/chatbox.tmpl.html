<div class="convo-chat">
    <div class="card">
        <div class="card-header">
            <i class="fa fa-comment"></i> &nbsp; {{ name }}
            <div class="btn-group pull-right">
                <button type="button" class="btn btn-outline-primary btn-xs no-border-radius" title="Use this button to reset session. To reset installation, reload the page (to mimic first time use)." ng-click="onChatReset()">
	                <i class="fa fa-refresh"></i>
                </button>
	            <button type="button" class="btn btn-outline-primary btn-xs no-border-radius" title="Collapse chatbox" ng-click="collapsed = !collapsed">
                    <i class="fa" ng-class="{ 'fa-chevron-right' : collapsed, 'fa-chevron-down': !collapsed}"></i>
                </button>
            </div>
        </div>
        <div class="panel-collapse" ng-hide="collapsed" id="collapseOne">
            <div class="card-body" id="chat-panel-body">
                <ul class="chat">
                    <li class="clearfix chat-message" ng-repeat="message in messages track by $index" >
                        <div ng-if="message.type != 'break'" class="clearfix chat-body"
                        ng-class="{ 'right user-message' : message.source == 'user', 'left system-message' : message.source == 'convo'}"
                         ng-bind-html="applyMarkdown( message)"
                         ng-dblclick="copyMessage( message.text)"
                        ></div>
                    </li>
                </ul>
                <div style="height:6px; clear: both;" ng-if="isWriting()"></div>
                <div class="lds-ellipsis" ng-if="isWriting()"><div></div><div></div><div></div><div></div></div>
            </div>
            <div class="card-footer">
                <form ng-submit="formSubmitted()">
                    <div class="convo-form-group inline" id="chat">
<!--                         <input ng-model="message" autocomplete="off" id="message" type="text" -->
<!--                                class="convo-form-input" placeholder="Type your message here..." ng-disabled="isSending()"> -->
                        <textarea ng-model="message" class="convo-form-input" id="message" ng-disabled="isSending()"
                            placeholder="Type your message here..."></textarea>
                        <button ng-disabled="formDisabled()" class="btn btn-warning btn-sm" id="send" type="submit">
                            Send
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
