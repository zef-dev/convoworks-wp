<header class="block-header" ng-attr-title="{{ description }}">
    <div class="block-title-wrapper">
        <selectable-component-buttons ng-if="showButtons && toggleFn" toggle-fn="toggleFn"></selectable-component-buttons>
        <h3 class="block-title">
            {{ title }}
        </h3>
        <service-save-buttons ng-if="showSaveButtons"></service-save-buttons>
    </div>
</header>
