<div class="workflow-search">
    <div class="search-input-wrapper">
        <input 
            type="text" 
            class="form-control search-input"
            ng-model="searchTerm"
            ng-change="onSearchInput()"
            ng-focus="onInputFocus()"
            ng-keydown="onSearchKeydown($event)"
            placeholder="Search components (Ctrl+F / Cmd+F)"
            autocomplete="off" />
        <span class="search-icon">
            <i class="fa fa-search" ng-if="!isSearching"></i>
            <i class="fa fa-spinner fa-spin" ng-if="isSearching"></i>
        </span>
        <button 
            type="button" 
            class="btn-close-search"
            ng-if="isOpen || searchTerm"
            ng-click="closeSearch()"
            aria-label="Close search">
            <i class="fa fa-times"></i>
        </button>
    </div>
    
    <div class="search-results" ng-if="isOpen && results.length > 0">
        <div class="search-results-header">
            <span>{{ results.length }} result{{ results.length !== 1 ? 's' : '' }} found</span>
        </div>
        <div class="search-results-list">
            <div 
                class="search-result"
                ng-class="{ 'selected': selectedIndex === $index }"
                ng-repeat="result in results track by result.componentId"
                ng-click="selectResult(result, $index)"
                ng-mouseenter="selectedIndex = $index">
                <div class="result-header">
                    <span class="result-name">{{ result.name }}</span>
                    <span class="result-type-badge" ng-if="result.type === 'block'">Block</span>
                    <span class="result-type-badge" ng-if="result.type === 'fragment'">Fragment</span>
                    <span class="result-type-badge" ng-if="result.type === 'component'">Component</span>
                </div>
                <div class="result-path">{{ getPathString(result) }}</div>
            </div>
        </div>
    </div>
    
    <div class="search-results-empty" ng-if="isOpen && !isSearching && results.length === 0 && searchTerm">
        <span>No results found</span>
    </div>
</div>
