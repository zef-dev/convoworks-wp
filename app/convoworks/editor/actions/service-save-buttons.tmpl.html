<form ng-submit="saveChanges()">
    <div class="convo-button-group">
        <button type="submit" title="Save changes" ng-disabled="!isServiceChanged() || hasActiveProcesses() || loading"
            class="btn btn-md btn-primary">
            Save
        </button>
        <button type="button" ng-click="revertClicked()" title="Revert changes" ng-disabled="!isServiceChanged() || hasActiveProcesses() || loading"
            class="cancel">Revert</button>
    </div>
</form>
